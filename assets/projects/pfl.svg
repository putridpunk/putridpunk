<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="PFL project cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B08"/>
      <stop offset="1" stop-color="#0A2416"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2DFC6F" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2DFC6F" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2DFC6F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="800" height="450" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="800" height="450" fill="url(#bg)"/>
    <rect width="800" height="450" fill="url(#grid)"/>
    <circle cx="630" cy="220" r="220" fill="url(#glow)"/>

    <text x="64" y="102" fill="#2DFC6F" font-family="monospace" font-size="16" letter-spacing="4">FUNCTIONAL AND LOGIC PROGRAMMING</text>
    <text x="60" y="242" fill="#E8FFF0" font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="700" letter-spacing="2">PFL</text>
    <text x="66" y="292" fill="#9DBFAA" font-family="monospace" font-size="19" letter-spacing="3">PARSER COMBINATORS / HASKELL</text>

    <g font-family="monospace" font-size="14">
      <rect x="66" y="330" width="94" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="82" y="350" fill="#9DBFAA">PARSING</text>
      <rect x="170" y="330" width="108" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="185" y="350" fill="#9DBFAA">GHC</text>
      <rect x="288" y="330" width="128" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="303" y="350" fill="#9DBFAA">RECURSION</text>
    </g>

    <rect x="488" y="74" width="252" height="310" rx="18" fill="#07120C" stroke="#1E5C38" stroke-width="2"/>
    <text x="512" y="112" fill="#2DFC6F" font-family="monospace" font-size="14" letter-spacing="3">TRUTH TABLE</text>
    <line x1="512" y1="128" x2="716" y2="128" stroke="#1E5C38"/>

    <g font-family="monospace" font-size="18" fill="#9DBFAA">
      <text x="520" y="164">p</text>
      <text x="578" y="164">q</text>
      <text x="668" y="164">f</text>
      <text x="520" y="200">T</text>
      <text x="578" y="200">T</text>
      <text x="668" y="200" fill="#2DFC6F">T</text>
      <text x="520" y="236">T</text>
      <text x="578" y="236">F</text>
      <text x="668" y="236" fill="#2DFC6F">T</text>
      <text x="520" y="272">F</text>
      <text x="578" y="272">T</text>
      <text x="668" y="272" fill="#2DFC6F">T</text>
      <text x="520" y="308">F</text>
      <text x="578" y="308">F</text>
      <text x="668" y="308" fill="#2DFC6F">T</text>
    </g>

    <rect x="512" y="330" width="150" height="30" rx="6" fill="#2DFC6F"/>
    <text x="526" y="350" fill="#07120C" font-family="monospace" font-size="14" font-weight="700">TAUTOLOGY</text>
    <text x="676" y="350" fill="#5E8B72" font-family="monospace" font-size="14">2^n</text>
  </g>
