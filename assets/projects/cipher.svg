<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="CipherCheck project cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B08"/>
      <stop offset="1" stop-color="#0A2416"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2DFC6F" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2DFC6F" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2DFC6F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="800" height="450" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="800" height="450" fill="url(#bg)"/>
    <rect width="800" height="450" fill="url(#grid)"/>
    <circle cx="630" cy="225" r="230" fill="url(#glow)"/>

    <text x="64" y="102" fill="#2DFC6F" font-family="monospace" font-size="16" letter-spacing="4">PASSWORD SECURITY AUDITOR</text>
    <text x="60" y="242" fill="#E8FFF0" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="700" letter-spacing="2">CIPHER</text>
    <text x="66" y="292" fill="#9DBFAA" font-family="monospace" font-size="19" letter-spacing="3">CHECK / ENTROPY / PATTERNS</text>

    <g font-family="monospace" font-size="14">
      <rect x="66" y="330" width="86" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="80" y="350" fill="#2DFC6F">PYTHON</text>
      <rect x="162" y="330" width="94" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="176" y="350" fill="#9DBFAA">OFFLINE</text>
      <rect x="266" y="330" width="94" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="280" y="350" fill="#9DBFAA">ENTROPY</text>
      <rect x="370" y="330" width="110" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="384" y="350" fill="#9DBFAA">CLI + GUI</text>
    </g>

    <g font-family="monospace" font-size="12">
      <text x="66" y="392" fill="#2DFC6F" opacity="0.7">H = L * log2(R)</text>
      <text x="66" y="410" fill="#5E8B72">p@ssw0rd -&gt; password  [leetspeak]</text>
    </g>

    <rect x="520" y="62" width="220" height="326" rx="18" fill="#07120C" stroke="#2DFC6F" stroke-width="3"/>

    <text x="540" y="92" fill="#5E8B72" font-family="monospace" font-size="11" letter-spacing="2">PASSWORD</text>
    <rect x="540" y="102" width="180" height="34" rx="8" fill="#0A2416" stroke="#1E5C38"/>
    <g fill="#E8FFF0">
      <circle cx="558" cy="119" r="4"/><circle cx="574" cy="119" r="4"/><circle cx="590" cy="119" r="4"/>
      <circle cx="606" cy="119" r="4"/><circle cx="622" cy="119" r="4"/><circle cx="638" cy="119" r="4"/>
      <circle cx="654" cy="119" r="4"/><circle cx="670" cy="119" r="4"/>
    </g>
    <rect x="684" y="110" width="2" height="18" fill="#2DFC6F"/>

    <text x="540" y="164" fill="#5E8B72" font-family="monospace" font-size="11" letter-spacing="2">STRENGTH</text>
    <g>
      <rect x="540" y="172" width="32" height="12" rx="3" fill="#2DFC6F"/>
      <rect x="577" y="172" width="32" height="12" rx="3" fill="#2DFC6F"/>
      <rect x="614" y="172" width="32" height="12" rx="3" fill="#2DFC6F" opacity="0.6"/>
      <rect x="651" y="172" width="32" height="12" rx="3" fill="#0A2416" stroke="#1E5C38"/>
      <rect x="688" y="172" width="32" height="12" rx="3" fill="#0A2416" stroke="#1E5C38"/>
    </g>
    <text x="540" y="206" fill="#2DFC6F" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">MODERATE</text>

    <g font-family="monospace" font-size="12">
      <text x="540" y="238" fill="#E8FFF0">[-] leetspeak found</text>
      <text x="540" y="260" fill="#E8FFF0">[-] common password</text>
      <text x="540" y="282" fill="#2DFC6F">[+] mixed charsets</text>
    </g>

    <g font-family="monospace" font-size="11">
      <rect x="540" y="302" width="48" height="22" rx="5" fill="#0A2416" stroke="#1E5C38"/>
      <text x="552" y="317" fill="#9DBFAA">MD5</text>
      <rect x="596" y="302" width="56" height="22" rx="5" fill="#0A2416" stroke="#1E5C38"/>
      <text x="608" y="317" fill="#9DBFAA">SHA</text>
      <rect x="660" y="302" width="60" height="22" rx="5" fill="#0A2416" stroke="#1E5C38"/>
      <text x="670" y="317" fill="#9DBFAA">bcrypt</text>
    </g>

    <rect x="540" y="346" width="180" height="22" rx="6" fill="#0A2416" stroke="#1E5C38"/>
    <text x="630" y="362" fill="#2DFC6F" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1">ANALYZE  AUDIT  HASH</text>
  </g>
</svg>
