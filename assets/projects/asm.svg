<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Assembly Calculator project cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B08"/>
      <stop offset="1" stop-color="#0A2416"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2DFC6F" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2DFC6F" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2DFC6F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="800" height="450" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="800" height="450" fill="url(#bg)"/>
    <rect width="800" height="450" fill="url(#grid)"/>
    <circle cx="630" cy="225" r="230" fill="url(#glow)"/>

    <text x="64" y="102" fill="#2DFC6F" font-family="monospace" font-size="16" letter-spacing="4">X86-64 ASSEMBLY</text>
    <text x="60" y="242" fill="#E8FFF0" font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="700" letter-spacing="2">ASM</text>
    <text x="66" y="292" fill="#9DBFAA" font-family="monospace" font-size="19" letter-spacing="3">SCIENTIFIC CALCULATOR</text>

    <g font-family="monospace" font-size="14">
      <rect x="66" y="330" width="92" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="79" y="350" fill="#2DFC6F">x86-64</text>
      <rect x="168" y="330" width="78" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="181" y="350" fill="#9DBFAA">Win32</text>
      <rect x="256" y="330" width="64" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="269" y="350" fill="#9DBFAA">GAS</text>
      <rect x="330" y="330" width="104" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="343" y="350" fill="#9DBFAA">NO LIBC</text>
    </g>

    <g font-family="monospace" font-size="12">
      <text x="66" y="392" fill="#2DFC6F" opacity="0.7">fld   qword ptr [rbp-8]</text>
      <text x="66" y="410" fill="#5E8B72">fmulp st(1), st</text>
    </g>

    <rect x="520" y="62" width="220" height="326" rx="18" fill="#07120C" stroke="#2DFC6F" stroke-width="3"/>
    <rect x="540" y="84" width="180" height="76" rx="8" fill="#0A2416" stroke="#1E5C38"/>
    <text x="708" y="112" fill="#5E8B72" font-family="monospace" font-size="12" text-anchor="end">sin(30)</text>
    <text x="708" y="146" fill="#2DFC6F" font-family="monospace" font-size="30" font-weight="700" text-anchor="end">0.5</text>

    <g font-family="monospace" font-size="16" text-anchor="middle">
      <g fill="#0A2416" stroke="#1E5C38">
        <rect x="540" y="180" width="39" height="32" rx="6"/><rect x="587" y="180" width="39" height="32" rx="6"/><rect x="634" y="180" width="39" height="32" rx="6"/>
        <rect x="540" y="220" width="39" height="32" rx="6"/><rect x="587" y="220" width="39" height="32" rx="6"/><rect x="634" y="220" width="39" height="32" rx="6"/>
        <rect x="540" y="260" width="39" height="32" rx="6"/><rect x="587" y="260" width="39" height="32" rx="6"/><rect x="634" y="260" width="39" height="32" rx="6"/>
        <rect x="540" y="300" width="39" height="32" rx="6"/><rect x="587" y="300" width="39" height="32" rx="6"/>
      </g>
      <g fill="#2DFC6F" stroke="#2DFC6F">
        <rect x="681" y="180" width="39" height="32" rx="6"/>
        <rect x="681" y="220" width="39" height="32" rx="6"/>
        <rect x="681" y="260" width="39" height="32" rx="6"/>
        <rect x="681" y="300" width="39" height="32" rx="6"/>
        <rect x="634" y="300" width="39" height="32" rx="6"/>
      </g>
      <g fill="#9DBFAA">
        <text x="559" y="201">7</text><text x="606" y="201">8</text><text x="653" y="201">9</text>
        <text x="559" y="241">4</text><text x="606" y="241">5</text><text x="653" y="241">6</text>
        <text x="559" y="281">1</text><text x="606" y="281">2</text><text x="653" y="281">3</text>
        <text x="559" y="321">0</text><text x="606" y="321">.</text>
      </g>
      <g fill="#07120C" font-weight="700">
        <text x="700" y="201">/</text><text x="700" y="241">*</text><text x="700" y="281">-</text><text x="700" y="321">+</text>
        <text x="653" y="321">=</text>
      </g>
    </g>
    <rect x="540" y="346" width="180" height="22" rx="6" fill="#0A2416" stroke="#1E5C38"/>
    <text x="630" y="362" fill="#2DFC6F" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="2">DEG  sin cos tan</text>
  </g>
</svg>
