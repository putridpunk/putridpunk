<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="FSI project cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B08"/>
      <stop offset="1" stop-color="#0A2416"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2DFC6F" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2DFC6F" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2DFC6F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="800" height="450" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="800" height="450" fill="url(#bg)"/>
    <rect width="800" height="450" fill="url(#grid)"/>
    <circle cx="622" cy="213" r="230" fill="url(#glow)"/>

    <circle cx="622" cy="213" r="188" fill="none" stroke="#2DFC6F" stroke-opacity="0.14" stroke-dasharray="3 9"/>
    <circle cx="622" cy="213" r="226" fill="none" stroke="#2DFC6F" stroke-opacity="0.08"/>

    <text x="64" y="102" fill="#2DFC6F" font-family="monospace" font-size="16" letter-spacing="4">FOUNDATIONS OF COMPUTER SECURITY</text>
    <text x="60" y="242" fill="#E8FFF0" font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="700" letter-spacing="2">FSI</text>
    <text x="66" y="292" fill="#9DBFAA" font-family="monospace" font-size="19" letter-spacing="3">SET-UID / XSS / SEED LABS</text>

    <g font-family="monospace" font-size="14">
      <rect x="66" y="330" width="88" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="82" y="350" fill="#2DFC6F">LINUX</text>
      <rect x="164" y="330" width="50" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="180" y="350" fill="#9DBFAA">C</text>
      <rect x="224" y="330" width="104" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="238" y="350" fill="#9DBFAA">SET-UID</text>
      <rect x="338" y="330" width="62" height="30" rx="6" fill="#0A2416" stroke="#1E5C38"/>
      <text x="353" y="350" fill="#9DBFAA">XSS</text>
    </g>

    <g font-family="monospace" font-size="12">
      <text x="66" y="392" fill="#2DFC6F" opacity="0.7">-rwsr-xr-x root root /usr/bin/passwd</text>
      <text x="66" y="410" fill="#5E8B72">&lt;script&gt;alert(document.cookie)&lt;/script&gt;</text>
    </g>

    <path d="M622 62 L716 100 V206 C716 282 676 336 622 364 C568 336 528 282 528 206 V100 Z" fill="#07120C" stroke="#2DFC6F" stroke-width="3"/>
    <path d="M622 86 L694 116 V204 C694 264 664 308 622 332 C580 308 550 264 550 204 V116 Z" fill="#0A2416" stroke="#1E5C38"/>

    <g fill="#2DFC6F">
      <circle cx="574" cy="134" r="4" opacity="0.9"/>
      <circle cx="590" cy="134" r="4" opacity="0.55"/>
      <circle cx="606" cy="134" r="4" opacity="0.3"/>
    </g>
    <line x1="562" y1="146" x2="682" y2="146" stroke="#1E5C38"/>

    <g font-family="monospace" font-size="15">
      <text x="566" y="168" fill="#2DFC6F">$ whoami</text>
      <text x="566" y="190" fill="#E8FFF0">user</text>
      <text x="566" y="214" fill="#2DFC6F">$ ./exploit</text>
      <text x="566" y="236" fill="#E8FFF0">uid=0(root)</text>
      <text x="566" y="258" fill="#2DFC6F">#</text>
    </g>
    <rect x="582" y="246" width="9" height="15" fill="#2DFC6F"/>
    <rect x="572" y="272" width="100" height="8" rx="4" fill="#2DFC6F" opacity="0.6"/>
    <rect x="590" y="286" width="64" height="8" rx="4" fill="#2DFC6F" opacity="0.3"/>

    <g fill="#07120C" stroke="#2DFC6F" stroke-width="2">
      <circle cx="528" cy="100" r="5"/>
      <circle cx="716" cy="100" r="5"/>
    </g>
  </g>
</svg>
